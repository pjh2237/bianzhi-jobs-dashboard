<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>编制招聘信息汇总 · 近半年总览大屏</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a14; --panel:rgba(16,24,42,.78); --line:rgba(80,150,220,.18);
  --txt:#dbe8f7; --dim:#7f93b0; --cy:#22d3ee; --bl:#3b82f6; --gr:#34d399;
  --or:#fbbf24; --pk:#f472b6; --pu:#a78bfa; --rd:#f87171;
}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(1000px 500px at 90% 0%, rgba(59,130,246,.12), transparent 55%),
    var(--bg);
  color:var(--txt); font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding:18px 22px 40px; min-height:100%;
}
.wrap{max-width:1560px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
h1{font-size:26px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(92deg,#e8f6ff,#22d3ee 55%,#3b82f6);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:4px}
.badge{padding:5px 12px;border-radius:999px;border:1px solid rgba(34,211,238,.35);
  background:rgba(34,211,238,.08);color:var(--cy);font-size:12.5px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,var(--cy),transparent)}
.kpi .lbl{color:var(--dim);font-size:12.5px}
.kpi .val{font-size:28px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;
  color:#f2fbff;letter-spacing:.5px}
.kpi .val small{font-size:13px;color:var(--dim);font-weight:400;margin-left:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px 18px;margin-bottom:16px}
.panel h2{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:10px;
  margin-bottom:12px;color:#eaf6ff}
.panel h2::before{content:"";width:3px;height:15px;border-radius:2px;
  background:linear-gradient(180deg,var(--cy),var(--bl))}
.hint{font-size:12px;color:var(--dim);font-weight:400;margin-left:auto}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cat{background:rgba(255,255,255,.028);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.cat:hover{background:rgba(34,211,238,.09);border-color:rgba(34,211,238,.45);transform:translateY(-1px)}
.cat.on{background:rgba(34,211,238,.16);border-color:var(--cy);box-shadow:0 0 0 1px rgba(34,211,238,.4),0 0 22px -6px rgba(34,211,238,.5)}
.cat .nm{font-size:13px;color:#cfe3f6}
.cat .num{font-size:21px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.cat .np{font-size:11.5px;color:var(--gr);margin-top:2px;font-variant-numeric:tabular-nums}
.cat .np.zero{color:var(--dim)}
.cat.dim{opacity:.42}
.cat.dim:hover{opacity:.85}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;color:var(--dim);font-weight:500;font-size:12px;
  padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;
  background:#0d1526;z-index:2}
tbody td{padding:7px 10px;border-bottom:1px solid rgba(80,150,220,.09);vertical-align:top}
tbody tr:hover{background:rgba(34,211,238,.055)}
.wrapx{max-height:340px;overflow:auto;border-radius:8px}
.wrapx table{table-layout:fixed;width:100%}
.wrapx td{word-break:break-all}
#upTable td:nth-child(1),#upTable th:nth-child(1){width:60px}
#upTable td:nth-child(2),#upTable th:nth-child(2){width:90px}
#upTable td:nth-child(3),#upTable th:nth-child(3){width:64px}
#upTable td:nth-child(4),#upTable th:nth-child(4){width:200px}
#upTable td:nth-child(6),#upTable th:nth-child(6){width:74px}
#upTable td:nth-child(7),#upTable th:nth-child(7){width:96px;white-space:nowrap}
#latTable td:nth-child(1),#latTable th:nth-child(1){width:58px}
#latTable td:nth-child(2),#latTable th:nth-child(2){width:90px}
#latTable td:nth-child(3),#latTable th:nth-child(3){width:64px}
#latTable td:nth-child(4),#latTable th:nth-child(4){width:200px}
#latTable td:nth-child(6),#latTable th:nth-child(6){width:74px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;
  border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.1);color:#7fe3f5;white-space:nowrap}
.tag.r{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12);color:#fca5a5}
.tag.y{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.12);color:#fcd34d}
a{color:#8fd8ff;text-decoration:none}
a:hover{text-decoration:underline}
.bars{display:flex;align-items:flex-end;gap:14px;height:190px;padding:6px 4px 0}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar .b{width:100%;max-width:78px;border-radius:6px 6px 2px 2px;
  background:linear-gradient(180deg,#22d3ee,#2563eb);position:relative;transition:.25s;
  box-shadow:0 0 18px -6px rgba(34,211,238,.7)}
.bar:hover .b{filter:brightness(1.18)}
.bar .v{font-size:12.5px;font-variant-numeric:tabular-nums;color:#cfe6ff}
.bar .m{font-size:12px;color:var(--dim)}
.pies{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pie{background:rgba(255,255,255,.022);border:1px solid var(--line);border-radius:12px;padding:14px}
.pie h3{font-size:13.5px;font-weight:600;color:#d8ecff;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.pie h3 .k{font-size:11.5px;color:var(--dim);font-weight:400}
.pbody{display:flex;gap:14px;align-items:flex-start}
svg{flex:0 0 auto;overflow:visible}
svg path{cursor:pointer;transition:.14s;transform-origin:center}
svg path:hover{filter:brightness(1.3)}
.lg{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;
  max-height:236px;overflow:auto;padding-right:4px}
.lg .it{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;
  padding:1px 2px;border-radius:4px;white-space:nowrap;overflow:hidden}
.lg .it:hover{background:rgba(34,211,238,.1)}
.lg .it.on{background:rgba(34,211,238,.18)}
.lg .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.lg .n{color:#c8dcf0;overflow:hidden;text-overflow:ellipsis}
.lg .v{color:var(--dim);margin-left:auto;font-variant-numeric:tabular-nums;font-size:11.5px}
.lg .p{color:#5f7699;font-size:11px;min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.notice{margin-top:10px;font-size:12px;color:var(--dim);border-left:2px solid rgba(251,191,36,.5);
  padding-left:8px}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px}
.chip{padding:3px 10px;border-radius:999px;border:1px solid rgba(34,211,238,.4);
  background:rgba(34,211,238,.12);color:#8be9f8;cursor:pointer}
.chip:hover{background:rgba(34,211,238,.24)}
.empty{color:var(--dim);text-align:center;padding:24px;font-size:13px}
@media(max-width:1280px){
  .cats{grid-template-columns:repeat(4,1fr)}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .pies{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>编制招聘信息汇总 · 近半年总览大屏</h1>

    <div class="badge" id="rangeBadge"></div>

  <section class="kpis" id="kpis"></section>

    </table></div>
  </section>
</div>

    S.table = (S.table===c.dataset.t) ? null : c.dataset.t;
    renderAll();
  });
}

/* ---------- 筛选条 ---------- */
function renderFilterBar(){
  const parts=[];
  if(S.table) parts.push(`<span class="chip" data-k="table">类别：${S.table} ✕</span>`);
  if(S.prov)  parts.push(`<span class="chip" data-k="prov">省份：${S.prov} ✕</span>`);
  if(S.obj)   parts.push(`<span class="chip" data-k="obj">招聘对象：${S.obj} ✕</span>`);
  if(S.itv)   parts.push(`<span class="chip" data-k="itv">面试方式：${S.itv} ✕</span>`);
  const bar = document.getElementById('filterBar');
  bar.innerHTML = parts.length ? parts.join('') +
      `<span class="chip" data-k="all" style="border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.12);color:#fca5a5">清空全部</span>`
    : `<span style="color:#7f93b0">当前展示全部数据，点击上方类别卡片或下方饼图进行筛选</span>`;
  bar.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const k=c.dataset.k;
    if(k==='all'){S.table=S.prov=S.obj=S.itv=null;} else {S[k]=null;}
    renderAll();
  });
}

/* ---------- 即将截止 ---------- */
function matchRec(r){
  if(S.table && r.t!==S.table) return false;
  if(S.prov && r.p!==S.prov) return false;
  if(S.obj && (r.o||[]).indexOf(S.obj)<0) return false;
  if(S.itv && (r.i||[]).indexOf(S.itv)<0) return false;
  return true;
}
function renderUpcoming(){
  const list = (D.upcomingList||[]).filter(matchRec).slice().sort((x,y)=>x.left-y.left);
  const body = document.getElementById('upBody');
  if(!list.length){ body.innerHTML = `<tr><td colspan="7" class="empty">当前筛选条件下暂无 7 天内截止的岗位</td></tr>`; return; }
  body.innerHTML = list.map(r=>{
    const cls = r.left<=1?'r':(r.left<=3?'y':'');
    return `<tr><td><span class="tag ${cls}">${r.left}天</span></td>
      <td>${r.t}</td><td>${r.p||'-'}</td><td>${r.u||'-'}</td>
      <td>${r.url?`<a href="${r.url}" target="_blank" rel="noopener">${r.ti||'-'}</a>`:(r.ti||'-')}</td>
      <td>${r.n||'-'}</td><td>${r.dl}</td></tr>`;
  }).join('');
}

/* ---------- 柱状趋势 ---------- */
function renderBars(a){
  const el = document.getElementById('bars');
  const ms = D.months;
  const mx = Math.max(...ms.map(m=>a.bm[m]||0), 1);
  el.innerHTML = ms.map(m=>{
    const v = a.bm[m]||0;
    const h = Math.round(v/mx*100);
    return `<div class="bar"><div class="v">${fmt(v)}</div>
      <div class="b" style="height:${h}%;min-height:3px"></div>
      <div class="m">${m.slice(5)}月</div></div>`;
  }).join('');
}

/* ---------- 饼图 ---------- */
function hslFn(i,n){ return `hsl(${Math.round(190 + i*360/Math.max(n,1))%360}, 56%, ${i%2?58:43}%)`; }
function pick(colors,i,n,it){ if(it&&it.other) return '#334155';
  return typeof colors==='function' ? colors(i,n) : colors[i%colors.length]; }

function pieSVG(items, size, colors, key){
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  const cx=size/2, cy=size/2, R=size/2-3, r0=size*0.045;
  let ang=-Math.PI/2, out='';
  items.forEach((it,i)=>{
    const frac = it.value/total;
    if(frac<=0){ return; }
    const a2 = ang + Math.PI*2*frac;
    const large = (a2-ang)>Math.PI ? 1 : 0;
    const x1=cx+R*Math.cos(ang), y1=cy+R*Math.sin(ang);
    const x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
    const p = `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${R} ${R} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
    const col = pick(colors,i,items.length,it);
    const on = (S[key]===it.name) ? ' stroke="#fff" stroke-width="1.5"' : '';
    const dk = it.other ? '' : `data-k="${key}" data-n="${it.name}"`;
    out += `<path d="${p}" fill="${col}" opacity=".93"${on} ${dk}><title>${it.name} ${fmt(it.value)}（${pct(it.value,total)}）</title></path>`;
    ang = a2;
  });
  out += `<circle cx="${cx}" cy="${cy}" r="${r0}" fill="#0a1120" opacity=".95"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${out}</svg>`;
}

function legendHTML(items, colors, total, key){
  return items.map((it,i)=>{
    const on = (S[key]===it.name && !it.other)?' on':'';
    const dk = it.other ? '' : `data-k="${key}" data-n="${it.name}"`;
    return `<div class="it${on}" ${dk}>
      <span class="sw" style="background:${pick(colors,i,items.length,it)}"></span>
      <span class="n">${it.name}</span>
      <span class="v">${fmt(it.value)}</span>
      <span class="p">${pct(it.value,total)}</span></div>`;
  }).join('');
}

function pieCard(title, sub, items, key, size, colors, note){
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  return `<div class="pie">
    <h3>${title}<span class="k">${sub}</span></h3>
    <div class="pbody">${pieSVG(items,size,colors,key)}
      <div class="lg">${legendHTML(items,colors,total,key)}</div></div>
    ${note?`<div class="notice">${note}</div>`:''}
  </div>`;
}

/* 招聘对象 / 面试方式：按当前类别筛选后重算 */
function tagAgg(key){
  const src = (key==='obj' ? D.objByTable : D.itvByTable) || {};
  const acc = {};
  const tables = S.table ? [S.table] : D.order;
  tables.forEach(t=>{
    const m = src[t] || {};
    for(const k in m) acc[k] = (acc[k]||0) + m[k];
  });
  return Object.keys(acc).map(k=>({name:k, value:acc[k]}))
    .filter(x=>x.value>0).sort((x,y)=>y.value-x.value);
}

function topN(items, n){
  if(items.length<=n) return items;
  const head = items.slice(0,n);
  const rest = items.slice(n).reduce((s,i)=>s+i.value,0);
  if(rest>0) head.push({name:`其他 ${items.length-n} 项`, value:rest, other:true});
  return head;
}

function renderPies(a){
  const provItems = D.prov.order.map(p=>({name:p, value:a.bp[p]||0})).filter(x=>x.value>0);
  const catItems = D.order.map(t=>({name:t, value:a.bt[t]||0})).filter(x=>x.value>0);
  const objItems = topN(tagAgg('obj'), 11);
  const itvItems = topN(tagAgg('itv'), 11);
  const scope = S.table ? `仅「${S.table}」` : '全部12类';

  document.getElementById('pies').innerHTML =
    pieCard('省份分布', '31省行政区 + 国家 · 共32份', provItems, 'prov', 210, hslFn,
      '香港 / 澳门 / 台湾 暂无数据（当前无招聘记录）') +
    pieCard('招聘类别分布', '12类岗位占比', catItems, 'table', 210, COLORS, '') +
    pieCard('招聘对象分布', scope + ' · 多选标签计次', objItems, 'obj', 210, COLORS,
      '同一岗位可命中多个标签，合计大于岗位数') +
    pieCard('面试方式分布', scope + ' · 多选标签计次', itvItems, 'itv', 210, COLORS,
      '同一岗位可命中多个标签，合计大于岗位数');

  document.querySelectorAll('#pies path[data-k], #pies .it[data-k]').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.k, n = el.dataset.n;
      if(!k || !n) return;
      S[k] = (S[k]===n) ? null : n;
      renderAll();
    };
  });
}

/* ---------- 最新发布明细 ---------- */
function renderLatest(){
  const list = (D.latestList||[]).filter(matchRec);
  document.getElementById('latestHint').textContent =
    `全部 ${fmt(D.latestTotal)} 条 · 当前筛选 ${fmt(list.length)} 条`;
  const body = document.getElementById('latestBody');
  if(!list.length){ body.innerHTML = `<tr><td colspan="6" class="empty">当前筛选条件下暂无数据</td></tr>`; return; }
  body.innerHTML = list.map(r=>
    `<tr><td>${r.d.slice(5)}</td><td>${r.t}</td><td>${r.p||'-'}</td><td>${r.u||'-'}</td>
     <td>${r.url?`<a href="${r.url}" target="_blank" rel="noopener">${r.ti||'-'}</a>`:(r.ti||'-')}</td>
     <td>${r.n||'-'}</td></tr>`).join('');
}

function renderAll(){
  const a = agg();
  renderKpis(a);
  renderCats(a);
  renderFilterBar();
  renderUpcoming();
  renderBars(a);
  renderPies(a);
  renderLatest();
}
renderAll();
})();
</script>
</body>
</html>
